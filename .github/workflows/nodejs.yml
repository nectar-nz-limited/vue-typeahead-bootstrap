name: Required CI validation

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate GitHub Actions syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          bin_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$bin_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" actionlint
          "$bin_dir/actionlint" -color

      - name: Scan committed source with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$bin_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" dir . --no-banner --redact --no-color

      - name: Validate workflow action pinning
        run: ruby .github/ci/validate_workflows.rb

      - name: Validate repository integrity
        run: python .github/ci/validate_repository.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate legacy manifest and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json
          test -s package-lock.json
          node --check .eslintrc.js
          node --check .postcssrc.js
          node --check babel.config.js
          node --check jest.config.js
          node --check vue.config.js
